<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PizzaFire 🔥</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-body">

<!-- Animated BG Blobs -->
<div class="auth-bg">
  <div class="auth-blob ab1"></div>
  <div class="auth-blob ab2"></div>
  <div class="auth-blob ab3"></div>
  <div class="auth-blob ab4"></div>
</div>

<!-- Floating Emojis -->
<div class="auth-floaters">
  <span class="af af1">🍕</span><span class="af af2">🔥</span>
  <span class="af af3">🧀</span><span class="af af4">🍕</span>
  <span class="af af5">⭐</span><span class="af af6">🌶️</span>
</div>

<div class="auth-container">
  <div class="auth-card glass-card">

    <!-- Logo -->
    <a href="index.html" class="auth-logo">
      <span class="logo-fire-big">🔥</span>
      <span class="auth-logo-text">PizzaFire</span>
    </a>

    <h2 class="auth-title">Welcome Back!</h2>
    <p class="auth-subtitle">Sign in to continue your pizza journey 🍕</p>

    <!-- Error Message -->
    <div class="auth-error" id="loginError" style="display:none">
      <i class="fas fa-exclamation-circle"></i>
      <span id="loginErrorMsg">Invalid email or password.</span>
    </div>

    <!-- Form -->
    <div class="auth-form" id="loginForm">

      <div class="input-group">
        <input type="email" id="loginEmail" class="auth-input" placeholder=" " autocomplete="off" oninput="clearError()">
        <label class="floating-label">Email Address</label>
        <span class="input-icon"><i class="fas fa-envelope"></i></span>
      </div>

      <div class="input-group">
        <input type="password" id="loginPassword" class="auth-input" placeholder=" " autocomplete="off" oninput="clearError()">
        <label class="floating-label">Password</label>
        <span class="input-icon"><i class="fas fa-lock"></i></span>
        <button class="toggle-pass" type="button" onclick="togglePass('loginPassword', this)">
          <i class="fas fa-eye"></i>
        </button>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe"> Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button class="btn-auth" onclick="handleLogin()">
        <span class="btn-auth-text">Sign In 🔥</span>
        <div class="btn-ripple"></div>
      </button>
    </div>

    <div class="auth-divider"><span>or continue with</span></div>

    <div class="social-auth">
      <button class="btn-social"><i class="fab fa-google"></i> Google</button>
      <button class="btn-social"><i class="fab fa-facebook-f"></i> Facebook</button>
    </div>

    <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up Free →</a></p>
  </div>
</div>

<script src="script.js"></script>
<script>
function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const errDiv = document.getElementById('loginError');
  const errMsg = document.getElementById('loginErrorMsg');

  if (!email || !pass) {
    errMsg.textContent = 'Please fill in all fields.';
    errDiv.style.display = 'flex';
    shakForm();
    return;
  }

  const users = JSON.parse(localStorage.getItem('pf_users') || '[]');
  const user = users.find(u => u.email === email && u.password === pass);

  if (!user) {
    errMsg.textContent = 'Invalid email or password. Try again.';
    errDiv.style.display = 'flex';
    shakForm();
    return;
  }

  // Login success
  localStorage.setItem('pf_loggedIn', JSON.stringify(user));
  showSuccessAnim(() => { window.location.href = 'index.html'; });
}

function shakForm() {
  const card = document.querySelector('.auth-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'shakeForm 0.4s ease';
}

function showSuccessAnim(cb) {
  const btn = document.querySelector('.btn-auth');
  btn.innerHTML = '<span class="btn-auth-text">✅ Success! Redirecting...</span>';
  btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
  setTimeout(cb, 1000);
}

function clearError() {
  document.getElementById('loginError').style.display = 'none';
}
</script>
</body>
</html>
